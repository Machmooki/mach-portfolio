<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement of Purpose</title>
<style>
  :root {
    --background: #FFFFFF;
    --card: #F7F7F7;
    --text: #171717;
    --secondary: #777777;
    --divider: #E8E8E8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    overflow-x: hidden;
    background: var(--background);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  main {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px calc(56px + env(safe-area-inset-bottom));
  }


  .eyebrow {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--secondary);
  }
  h1 {
    margin: 16px 0 12px;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    font-size: 38px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.025em;
  }
  .subtitle {
    margin: 0;
    font-size: 17px;
    line-height: 1.45;
    color: var(--secondary);
  }
  .intro {
    margin: 28px 0 0;
    padding-top: 28px;
    border-top: 1px solid var(--divider);
    font-size: 17px;
    line-height: 1.65;
  }


  .cards {
    display: grid;
    gap: 12px;
    margin-top: 40px;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .icon {
    width: 40px;
    height: 40px;
    padding: 9px;
    border-radius: 12px;
    background: var(--background);
    border: 1px solid var(--divider);
    color: var(--text);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .num {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card p {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--secondary);
  }


  .closing {
    margin-top: 48px;
    padding-top: 40px;
    border-top: 1px solid var(--divider);
    text-align: center;
  }
  .closing p { margin: 0; }
  .closing .statement {
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .closing .note {
    margin-top: 8px;
    font-size: 15px;
    color: var(--secondary);
  }


  .reveal, .card { animation: rise 0.5s ease-out both; }
  .cards .card:nth-child(2) { animation-delay: 0.06s; }
  .cards .card:nth-child(3) { animation-delay: 0.12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal, .card { animation: none; } }


  @media (max-width: 360px) {
    main { padding-left: 20px; padding-right: 20px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="icon-technology" viewBox="0 0 24 24">
    <rect x="6" y="6" width="12" height="12" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
    <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
  </symbol>
  <symbol id="icon-development" viewBox="0 0 24 24">
    <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/>
  </symbol>
  <symbol id="icon-security" viewBox="0 0 24 24">
    <path d="M12 3l7 3v5.5c0 4.3-2.9 8.1-7 9.5-4.1-1.4-7-5.2-7-9.5V6l7-3z"/>
    <path d="M9 12l2 2 4-4"/>
  </symbol>
</svg>

<main>
  <header class="reveal">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <p class="intro">{{INTRODUCTION}}</p>
  </header>

  <section class="cards" aria-label="Interests">
    {{SECTIONS}}
  </section>

  <footer class="closing reveal">
    <p class="statement">{{CLOSING}}</p>
    <p class="note">{{CLOSING_NOTE}}</p>
  </footer>
</main>
</body>
</html>
